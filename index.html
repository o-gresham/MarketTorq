<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Seller Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
    --bg: #0f1117;
    --card: #1a1d26;
    --accent: #5aa9ff;
    --accent2: #7cffc4;
    --text: #e6e6e6;
    --border: #2a2f3a;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.controls {
    position: sticky;
    bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 15px;
    margin-top: 20px;
    border-radius: 12px;
}

.controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

input[type="number"] {
    background: #0d0f14;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    border-radius: 8px;
    width: 100px;
}

button {
    background: linear-gradient(135deg, var(--accent), #3c7cff);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

button:hover {
    transform: translateY(-1px);
}

.copy-btn {
    background: linear-gradient(135deg, var(--accent2), #00c97c);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
}

.car {
    background: var(--card);
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.price {
    color: var(--accent2);
    font-weight: 600;
}

textarea {
    width: 100%;
    height: 200px;
    margin-top: 10px;
    background: #0a0c10;
    border: 1px solid var(--border);
    color: #00ff9c;
    padding: 12px;
    border-radius: 10px;
    font-family: monospace;
}

.search {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    background: #0d0f14;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
}
</style>
</head>
<body>

<div class="container">
<h1>Car Selling Generator</h1>

<input class="search" id="search" placeholder="Search cars..." oninput="filterCars()">

<div class="grid" id="carList"></div>

<div class="controls">
<div class="controls-row">
<label>Markup</label>
<input type="number" id="markup" value="1" step="0.01">

<button onclick="generate()">Generate</button>
<button class="copy-btn" onclick="copyOutput()">Copy</button>
<button onclick="selectAll()">Select All</button>
<button onclick="clearAll()">Clear</button>
</div>

<textarea id="output" placeholder="Discord output appears here..."></textarea>
</div>
</div>

<script>
const cars = [
["Merquis G Wafer", 175000000],
["Porx JT3 RF", 102800000],
["Mata FX7", 44900000],
["Porx JT2 RF", 22900000],
["Lambemos Iris", 15400000],
["DOGO Desafio", 13300000],
["Missah Groundline F34", 13100000],
["McLumber 520", 12900000],
["Lambemos Golhoes", 12700000],
["Missah Groundline F32", 8700000],
["Chule Curgette C7", 7300000],
["Toyoda A90", 6100000],
["Missah JTF", 6000000],
["Sucato Empresa", 5460000],
["Kart", 5460000],
["Toyoda Supwa", 5400000],
["Ruity Shadow", 4650000],
["Holde S2k", 4590000],
["Four Mustank 70s", 4420000],
["Vemca K3 G", 3600000],
["Holde NisX", 3890000],
["Toyoda TR2", 3820000],
["Porx Corre JT", 3890000],
["Leskus PALA", 2020000],
["Lararry 88 Pisca", 2570000],
["Leskus RFC", 1670000],
["Matsu Lanca 4x4", 1440000],
["Fia-Te Double", 1200000],
["Missah 750x", 1200000],
["Vemca K4 G", 1200000],
["Mandalorian JBC-12", 1060000],
["Missah Silva", 1220000],
["Jipao Pistola", 1230000],
["Leskus FP 50", 1050000],
["Merquis ZLA 45", 1000000],
["Merquis GLF63", 926000],
["Mata Piada", 895000],
["DOGO Carrega", 863000],
["Merquis JF", 445000],
["Vemca K3 F", 307000],
["Fia-Te UmDois", 292500],
["Chule Curgete", 243500],
["Ratos Rotos Esporte", 222200],
["Skami Truk", 205000],
["Merquis SLX", 192000],
["Mine Copa S", 182500],
["Holde TipeRar", 138300],
["Toyoda AFF67", 122700],
["Merquis F55", 105800],
["Lokswag Brasiuiu", 87500],
["Holde Proluiz", 79200],
["Fia-Te 10026p", 60600]
];

const carList = document.getElementById("carList");

function renderCars(list){
    carList.innerHTML = "";
    list.forEach(car=>{
        const index = cars.indexOf(car);
        const div = document.createElement("div");
        div.className="car";
        div.innerHTML=`
            <label>
                <input type="checkbox" value="${index}">
                ${car[0]}
            </label>
            <span class="price">$${car[1].toLocaleString()}</span>
        `;
        carList.appendChild(div);
    });
}

renderCars(cars);

function generate(){
    const markup = parseFloat(document.getElementById("markup").value) || 1;
    const checked = document.querySelectorAll("input[type=checkbox]:checked");

    let output="**SELLING**\n\n";

    checked.forEach(box=>{
        const car = cars[box.value];
        const price = Math.round(car[1]*markup).toLocaleString();
        output += `${car[0]} - $${price}\n`;
    });

    document.getElementById("output").value=output;
}

function copyOutput(){
    const text = document.getElementById("output");
    text.select();
    document.execCommand("copy");
}

function selectAll(){
    document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=true);
}

function clearAll(){
    document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
}

function filterCars(){
    const q = document.getElementById("search").value.toLowerCase();
    const filtered = cars.filter(c=>c[0].toLowerCase().includes(q));
    renderCars(filtered);
}
</script>

</body>
</html>
